<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Bloop</title>
</head>
<body>
<noscript>
    <h2>Sorry! Your browser doesn't support Javascript</h2>
</noscript>
<div id="username-page">
    <div class="username-page-container">
        <h1 class="title"></h1>
        <form id="usernameForm" name="usernameForm" method="post">
            <!--			<div class="form-group">-->
            <!--				<input type="text" id="name" placeholder="Username" autocomplete="off" class="form-control" />-->
            <!--				<input type="text" id="password" placeholder="Password" autocomplete="off" class="form-control"/>-->
            <!--				<input type="text" id="email" placeholder="Email" autocomplete="off" class="form-control"/>-->
            <!--			</div>-->
            <!--			<div class="form-group">-->
            <!--				<button type="submit" class="accent username-submit">Start Chatting</button>-->
            <!--			</div>-->
            <div class="login-header">
                <header>Login</header>
            </div>

            <div class="input-box">
                <input type="text" id = "name" name="username" class="input-field" placeholder="Username" autocomplete="off" required>
            </div>

            <div class="input-box">
                <input type="text" id="email" class="input-field" placeholder="Email" autocomplete="off" required>
            </div>

            <div class="input-box">
                <input type="password" id="password" name="password" class="input-field" placeholder="password" autocomplete="off" required>
            </div>
            <div class="input-box">
                <input type="text" id="recipient" name="recipient" class="input-field" placeholder="recipient" autocomplete="off" required>
            </div>
            <div class="forgot">
                <section>
                    <input type="checkbox" id="check">
                    <label for="check">Remember me</label>
                </section>
                <section>
                    <a href="#">Forgot Password</a>
                </section>
            </div>
            <div class="input-submit">
                <button type = "submit" class="submit-btn" id="submit">Sign In</button>
                <!--				<label for="submit">Sign In</label>-->
            </div>
            <div class="sign-up-link">
                <p>Don't have an Account? <a onclick="validate()">Sign In</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
