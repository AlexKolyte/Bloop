<div id="username-page">
	<div class="username-page-container">
		<h1 class="title"></h1>
		<form id="usernameForm" name="usernameForm" th:action="@{/authenticateTheUser}" method="post">
<!--			<div class="form-group">-->
<!--				<input type="text" id="name" placeholder="Username" autocomplete="off" class="form-control" />-->
<!--				<input type="text" id="password" placeholder="Password" autocomplete="off" class="form-control"/>-->
<!--				<input type="text" id="email" placeholder="Email" autocomplete="off" class="form-control"/>-->
<!--			</div>-->
<!--			<div class="form-group">-->
<!--				<button type="submit" class="accent username-submit">Start Chatting</button>-->
<!--			</div>-->
			<div class="login-header">
				<header>Login</header>
			</div>

			<div class="input-box">
				<input type="text" id = "name" name="username" class="input-field" placeholder="Username" autocomplete="off" required>
			</div>

			<div class="input-box">
				<input type="text" id="email" class="input-field" placeholder="Email" autocomplete="off" required>
			</div>

			<div class="input-box">
				<input type="password" id="password" name="password" class="input-field" placeholder="password" autocomplete="off" required>
			</div>
			<div class="input-box">
				<input type="text" id="recipient" name="recipient" class="input-field" placeholder="recipient" autocomplete="off" required>
			</div>
			<div class="forgot">
				<section>
					<input type="checkbox" id="check">
					<label for="check">Remember me</label>
				</section>
				<section>
					<a href="#">Forgot Password</a>
				</section>
			</div>
			<div class="input-submit">
				<button type = "submit" class="submit-btn" id="submit">Sign In</button>
<!--				<label for="submit">Sign In</label>-->
			</div>
			<div class="sign-up-link">
				<p>Don't have an Account? <a onclick="validate()">Sign In</a>
			</div>
		</form>
	</div>
</div>


<div id="sign-in-page" class="hidden">
	<div class="sign-in-page-container">

		<form id="signInForm" name="signInForm">

			<div class="sign-in-header">
				<header>Sign In</header>
			</div>

			<div class="input-box">
				<input type="text" id = "sign-in-name" class="input-field" placeholder="Username" autocomplete="off" required>
			</div>

			<div class="input-box">
				<input type="text" id="sign-in-email" class="input-field" placeholder="Email" autocomplete="off" required>
			</div>

			<div class="input-box">
				<input type="password" id="sign-in-password" class="input-field" placeholder="password" autocomplete="off" required>
			</div>
			<div class="input-submit">
				<button type = "sign-in-submit" class="submit-btn" id="sign-in-submit">Sign In</button>

		</form>
	</div>

<div id="chat-page" class="hidden">
	<div class="chat-container">
		<div class="chat-header">
			<h2>Bloop</h2>
		</div>
		<div class="connecting">
			Connecting...
		</div>
		<ul id="messageArea">

		</ul>
		<form id="messageForm" name="messageForm">
			<div class="form-group">
				<div class="input-group clearfix">
					<input type="text" id="message" placeholder="Type a message..." autocomplete="off" class="form-control"/>
					<button type="submit" class="primary">Send</button>
				</div>
			</div>
		</form>
	</div>
</div>
