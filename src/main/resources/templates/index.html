<body>
<div class="l-form" id="username-page">
	<div class="shape1"></div>
	<div class="shape2"></div>

	<div class="form">
		<img
				src="/image/authentication.svg"
				alt="auth"
				class="form__img" />

		<form
				id="usernameForm"
				th:action="@{/authenticateTheUser}"
				method="post"
				class="form__content"
		>
			<input
					type="hidden"
					th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}" />

			<h1 class="form__title">Welcome</h1>

			<div class="form__div form__div-one">
				<div class="form__icon"><i class='bx bx-user-circle'></i></div>
				<div class="form__div-input">
					<label for="name" class="form__label">Username</label>
					<input
							type="text"
							id="name"
							name="username"
							class="form__input"
							autocomplete="off"
							required />
				</div>
			</div>

			<div class="form__div">
				<div class="form__icon"><i class='bx bx-envelope'></i></div>
				<div class="form__div-input">
					<label for="email" class="form__label">Email</label>
					<input
							type="text"
							id="email"
							name="email"
							class="form__input"
							autocomplete="off"
							required />
				</div>
			</div>

			<div class="form__div">
				<div class="form__icon"><i class='bx bx-lock'></i></div>
				<div class="form__div-input">
					<label for="password" class="form__label">Password</label>
					<input
							type="password"
							id="password"
							name="password"
							class="form__input"
							autocomplete="off"
							required />
				</div>
			</div>

			<a href="#" class="form__forgot">Authentication required</a>
			<input type="submit" class="form__button" value="Login" />

<!--			<div class="form__social">-->
<!--				<span class="form__social-text">Or login with</span>-->
<!--				<a href="#" class="form__social-icon"><i class='bx bxl-facebook'></i></a>-->


<!--				<div class="g_id_signin form__social-icon"></div>-->

<!--				<a href="#" class="form__social-icon"><i class='bx bxl-instagram'></i></a>-->
<!--			</div>-->
		</form>
	</div>
</div>

<div id="chat-page" class="hidden">
	<div class="chat-container">
		<div class="chat-header">
			<h2>Bloop</h2>
		</div>

		<div class="connecting">
			Connecting...
		</div>
		<ul id="messageArea">

			<!-- Leaflet JS -->
			<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
			<!-- Geocoder plugin JS -->
			<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

		</ul>
		<form id="messageForm" name="messageForm">
			<div class="form-group">
				<div class="input-group clearfix">
					<input type="text" id="message" placeholder="Type a message..." autocomplete="off" class="form-control"/>
					<button type="submit" class="primary">Send</button>
				</div>
			</div>
		</form>
	</div>
</div>


<div id="users-page" class="hidden">
	<div class="user-container">
		<div class="user-header">
			<h2>Users</h2>
		</div>
	</div>
</div>


<div id="friend-page" class="hidden">
	<div class="friend-container">
		<ul id="friendArea">

		</ul>
		<form id="friendForm" name="friendForm">
			<div class="friend-group">

			</div>
		</form>
	</div>
</div>
<div id="error-page" class="hidden">
	<div class="error-container">
		<div class="error-header">
			<h2>User already exists! Try again and press Sign In</h2>
		</div>
	</div>
</div>
<!-- Profile icon, sits on top of everything else -->
<!-- Profile icon trigger stays the same -->
<a href="#!" id="profileIcon" class="profile-icon hidden">
	<img src="/image/settings.svg" alt="Profile" />
</a>

<!-- Sliding panel -->
<div id="profilePanel" class="profile-panel">
	<div class="input">
		<button class="value">

			</svg>
			Public profile

	</div>
</div>

				<button type="button" class="pf-button-action" id="pf-update-username">

				<button type="button" class="pf-button-action" id="pf-change-password">
